[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-captive-drain-replica"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.entry-points."inspect_robots.embodiments"]
drain_yam = "drain_runtime:embodiment"

[tool.setuptools]
py-modules = ["drain_runtime", "drain_base"]
